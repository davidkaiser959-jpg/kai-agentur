<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K.A.I. – Kunden. Automatisch. Informieren.</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .chat-box {
      width: 100%;
      max-width: 460px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .chat-header {
      background: #0284c7;
      padding: 16px 20px;
      font-weight: 700;
      font-size: 16px;
    }
    .chat-header span {
      display: block;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.9;
    }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #0284c7;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .bot {
      align-self: flex-start;
      background: #334155;
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }
    .input-area {
      display: flex;
      padding: 12px;
      background: #0f172a;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-box">
  <div class="chat-header">
    K.A.I. Assistent
    <span>Kunden. Automatisch. Informieren.</span>
  </div>
  <div id="messages">
    <div class="msg bot">Hallo! Wie kann ich dir heute weiterhelfen?</div>
  </div>
  <form class="input-area" id="chatForm">
    <input type="text" id="userInput" placeholder="Nachricht eingeben..." autocomplete="off" required />
    <button type="submit" id="sendBtn">Senden</button>
  </form>
</div>

<script>
  let chatHistory = [];

  const messagesDiv = document.getElementById("messages");
  const chatForm = document.getElementById("chatForm");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function appendMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;

    chatHistory.push({ role: "user", parts: [{ text }] });
    if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

    const botBubble = appendMessage("", "bot");
    let fullReply = "";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: chatHistory })
      });

      if (!response.ok) {
        let details = `Status ${response.status}`;
        try {
          const errJson = await response.json();
          if (errJson?.error) details = errJson.error;
        } catch (_) {}
        throw new Error(details);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const jsonStr = line.slice(6).trim();
            if (!jsonStr) continue;
            try {
              const data = JSON.parse(jsonStr);
              const chunk = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
              if (chunk) {
                fullReply += chunk;
                botBubble.textContent = fullReply;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
              }
            } catch (_) {}
          }
        }
      }

      chatHistory.push({ role: "model", parts: [{ text: fullReply }] });

    } catch (err) {
      botBubble.textContent = `Fehler: ${err.message}`;
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  });
</script>

</body>
</html>
