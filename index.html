<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAI | Kunden - Automatisch - Informieren</title>
  <meta name="description" content="KAI – Kunden - Automatisch - Informieren. Intelligente digitale Kundenassistenten für lokale Unternehmen." />
  <style>
    :root {
      --bg: #0b1120;
      --bg-card: #131c31;
      --bg-elevated: #1e293b;
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 88px;
    }

    .logo {
      display: inline-flex;
      flex-direction: column;
      width: max-content;
      line-height: 1.0;
    }

    .logo-main {
      display: inline-block;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--primary);
      text-transform: uppercase;
      transform: scaleX(2.65);
      transform-origin: left center;
    }

    .logo-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-top: 4px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .nav-links a:hover { color: var(--text); }

    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }

    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--bg-elevated);
    }

    /* Hero */
    .hero {
      padding: 84px 0 68px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.15;
      font-weight: 800;
      max-width: 820px;
      margin: 0 auto 20px;
      letter-spacing: -0.02em;
    }

    .hero h1 span { color: var(--primary); }

    .hero p {
      color: var(--text-muted);
      font-size: 18px;
      max-width: 650px;
      margin: 0 auto 32px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Sections */
    section { padding: 64px 0; }

    .section-title {
      text-align: center;
      margin-bottom: 44px;
    }

    .section-title h2 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .section-title p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Grid Cards */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(14, 165, 233, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Demo Banner */
    .demo-banner {
      background: var(--bg-card);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 38px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .demo-banner-text {
      max-width: 640px;
    }

    .demo-banner-text h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .demo-banner-text p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Contact Box */
    .contact-card {
      background: linear-gradient(135deg, #131c31 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
    }

    .contact-card h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .contact-card p {
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 26px;
    }

    .contact-methods {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0 90px;
      margin-top: 32px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a:hover { color: var(--text); }

    /* Floating Chat Launcher Button */
    .chat-launcher {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.45);
      transition: transform 0.2s, background 0.2s;
    }

    .chat-launcher:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .chat-launcher-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Floating Chat Window */
    .chat-widget {
      position: fixed;
      bottom: 84px;
      right: 22px;
      z-index: 1000;
      width: calc(100vw - 32px);
      max-width: 400px;
      height: 520px;
      max-height: calc(100vh - 110px);
      background: #1e293b;
